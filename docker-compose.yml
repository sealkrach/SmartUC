services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-usecasehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-usecasehub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published on the host: only reachable from the backend container.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usecasehub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-usecasehub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-usecasehub}
    depends_on:
      db:
        condition: service_healthy
    # Reached through the frontend nginx (/api, /mcp). Uncomment to debug locally only:
    # ports:
    #   - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app/templates:/app/app/templates
      - uploads:/app/uploads

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"   # put a TLS-terminating reverse proxy / ingress in front

volumes:
  pgdata:
  uploads:
